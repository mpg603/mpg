name: Update NYC subway wait

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"   # every 5 minutes (GitHub's minimum); runs may be delayed or skipped

permissions:
  contents: write

concurrency:
  group: subway-wait-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore cached static GTFS names
        uses: actions/cache@v4
        with:
          path: .cache
          key: subway-static-${{ github.run_id }}
          restore-keys: subway-static-
      - run: pip install gtfs-realtime-bindings
      - name: Build snapshot
        run: python scripts/update_subway_wait.py "$RUNNER_TEMP/subway-wait.json" --cache-dir .cache
      - name: Publish snapshot to the subway-wait-data branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          blob=$(git hash-object -w "$RUNNER_TEMP/subway-wait.json")
          tree=$(printf '100644 blob %s\tsubway-wait.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Subway wait snapshot")
          git push --force origin "$commit:refs/heads/subway-wait-data"
