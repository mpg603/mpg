name: Update NYC subway wait

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"   # every 5 minutes (GitHub's minimum); runs may be delayed or skipped

permissions:
  contents: write

concurrency:
  group: subway-wait-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore cached static GTFS names
        uses: actions/cache@v4
        with:
          path: .cache
          key: subway-static-${{ github.run_id }}
          restore-keys: subway-static-
      - run: pip install gtfs-realtime-bindings
      - name: Take a snapshot every minute for about four minutes
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          published=0
          for i in 1 2 3 4; do
            start=$SECONDS
            if python scripts/update_subway_wait.py "$RUNNER_TEMP/subway-wait.json" --cache-dir .cache \
               && bash scripts/publish_snapshot.sh "$RUNNER_TEMP/subway-wait.json"; then
              published=$((published+1))
            else
              echo "::warning::snapshot $i failed; the previous one stays up until it expires"
            fi
            if [ "$i" -lt 4 ]; then
              elapsed=$((SECONDS-start)); [ "$elapsed" -lt 60 ] && sleep $((60-elapsed))
            fi
          done
          echo "published $published of 4"
          [ "$published" -gt 0 ]
