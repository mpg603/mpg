<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fun Stuff</title>
<style>
@font-face{font-family:Lato;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/lato-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Lato;font-weight:700;font-style:normal;font-display:swap;src:url(fonts/lato-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Lato;font-weight:900;font-style:normal;font-display:swap;src:url(fonts/lato-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Inter Tight";font-weight:100 900;font-style:normal;font-display:swap;src:url(fonts/inter-tight-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-weight:200 900;font-style:normal;font-display:swap;src:url(fonts/source-serif-4-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-weight:200 900;font-style:italic;font-display:swap;src:url(fonts/source-serif-4-latin-wght-italic.woff2) format("woff2")}
:root{--paper:#fff;--card:#FAF7ED;--ink:#171717;--muted:#6f6e68;--line:#E6E1D2;--blue:#18558C;
 --ui:Lato,system-ui,-apple-system,"Segoe UI",sans-serif;--text:"Source Serif 4",Charter,Georgia,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--text)}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* masthead */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;max-width:1320px;margin:0 auto;padding:18px 20px 0}
.mark{font:800 27px/1 "Inter Tight",var(--ui);letter-spacing:-.02em;text-decoration:none;color:#000}
.top nav{display:flex;gap:22px}
.top nav a{font:700 15px/1 var(--ui);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;color:var(--muted)}
.top nav a:hover{color:var(--ink)}
.top nav a[aria-current]{color:var(--ink);border-bottom-color:var(--ink)}
/* ? hints (the popover itself is drawn once, at page level, so no card can clip it) */
.hint{all:unset;box-sizing:border-box;cursor:help;width:20px;height:20px;border:1.5px solid currentColor;border-radius:50%;display:inline-grid;place-items:center;font:700 11px/1 var(--ui);color:#a7a59b;vertical-align:middle;flex:none;padding:0 0 1px 1.5px}
.hint:hover,.hint:focus-visible,.hint[aria-expanded=true]{color:var(--ink)}
#tipbox{position:fixed;z-index:100;max-width:230px;background:#171717;color:#fff;border-radius:7px;padding:6px 9px;font:700 13px/1.3 Lato,var(--ui);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.2);opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
#tipbox.on{opacity:1;visibility:visible}

.page{max-width:1320px;margin:0 auto;padding:22px 20px 64px}
h1{margin:0 0 18px;font:900 28px/1.1 var(--ui);letter-spacing:-.01em}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.cell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cell iframe{display:block;width:100%;border:0;background:transparent}
.chead{padding:14px 16px 0;text-align:center;font:700 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);position:relative;z-index:2}
.hit{position:absolute;inset:0;z-index:1}
.sgs{margin:6px 16px 0;text-align:center;font:400 13px/1.3 var(--ui);color:var(--muted)}.sg{list-style:none;margin:0;padding:12px 16px 0}.sg li{padding:8px 0;border-top:1px solid var(--line)}.sg li:first-child{border-top:0}.sg b{display:block;font:700 15px/1.25 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sg span{display:block;font:400 13px/1.3 var(--ui);color:var(--muted)}
.more{display:block;position:relative;z-index:2;text-align:center;padding:8px 0 16px;font:700 14px/1 var(--ui);text-decoration:none}
</style></head><body>
<header class="top"><a class="mark" href="index.html">Miguel PG</a><nav aria-label="Main"><a href="index.html">Home</a><a href="funstuff.html" aria-current="page">Fun Stuff</a></nav></header>
<main class="page"><h1>Fun Stuff</h1><div id="grid"></div></main>
<script>
const POOL=["lunar", "maya-long-count", "french-republican", "pawukon", "byzantine", "burmese", "chinese", "international-fixed", "akan", "tonalpohualli", "tzolkin", "persian", "javanese", "discordian", "darian", "julian", "thai", "amazigh", "hindu", "armenian", "bahai", "coptic", "gregorian", "babylonian", "soviet", "islamic", "japanese", "haab", "hebrew", "old-icelandic", "bengali", "ethiopian", "tibetan", "zoroastrian", "saka", "xiuhpohualli", "roman"],H={"gregorian": 369, "julian": 369, "roman": 327, "byzantine": 374, "old-icelandic": 433, "french-republican": 405, "coptic": 374, "ethiopian": 374, "amazigh": 374, "armenian": 429, "hebrew": 412, "babylonian": 368, "islamic": 420, "persian": 374, "zoroastrian": 382, "bahai": 374, "saka": 374, "hindu": 418, "bengali": 401, "chinese": 508, "tibetan": 507, "japanese": 374, "burmese": 438, "thai": 374, "javanese": 459, "pawukon": 347, "maya-long-count": 372, "tzolkin": 513, "haab": 327, "tonalpohualli": 513, "xiuhpohualli": 327, "akan": 358, "soviet": 518, "international-fixed": 369, "discordian": 369, "lunar": 327, "darian": 374};
// The Calendars widget shows today's Calendar of the Day: the very same pick as the home page (same shuffled list, same day index, same pinned dates).
const day=Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5),ymd=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),PIN={"2026-11-26": "maya-long-count"};
const id=PIN[ymd]||POOL[((day%POOL.length)+POOL.length)%POOL.length],c=document.createElement('section');c.className='cell';
c.innerHTML='<div class="chead">Calendars</div>';
const f=document.createElement('iframe');f.setAttribute('aria-label','Calendars');f.src='widgets/'+id+'.html?embed=1';f.style.height=(H[id]||360)+'px';
c.appendChild(f);addEventListener('message',e=>{if(e.source===f.contentWindow&&e.data&&e.data.type==='calendar:height')f.style.height=e.data.height+'px'});
c.insertAdjacentHTML('beforeend','<a class="hit" href="calendars.html" aria-label="Calendars"></a><a class="more" href="calendars.html">All 37 calendars \u2192</a>');
document.getElementById('grid').appendChild(c);
const SG=[{"title": "Who Do You Call", "artist": "Yinka Bernie", "when": 1795375476}, {"title": "Djaliya", "artist": "Ablaye Cissoko", "when": 1795375089}, {"title": "Sasi Jaiva", "artist": "MISHY KOPE", "when": 1795374650}],sc=document.createElement('section');sc.className='cell';
sc.innerHTML='<div class="chead">First Spin</div><p class="sgs">The latest songs I heard for the first time</p><ul class="sg"></ul><a class="hit" href="songs.html" aria-label="First Spin, songs"></a><a class="more" href="songs.html">All songs \u2192</a>';
const fillSongs=L=>{const ul=sc.querySelector('.sg');ul.textContent='';L.slice(0,3).forEach(x=>{const li=document.createElement('li'),b=document.createElement('b'),sp=document.createElement('span');b.textContent=x.title;sp.textContent=x.artist+' \u00b7 '+new Date(x.when*1000).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});li.append(b,sp);ul.appendChild(li)})};
let liveS=false;const fbS=()=>{if(!liveS)fillSongs(SG)};setTimeout(fbS,4000);
fetch('https://subway-update.miguelpg603.workers.dev/songs',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(j&&j.ok&&Array.isArray(j.discovered)&&j.discovered.length){liveS=true;fillSongs(j.discovered)}else fbS()}).catch(fbS);
document.getElementById('grid').appendChild(sc);

</script></body></html>
