<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NYC Subwaits</title><style>html,body{margin:0;background:transparent}body{display:flex;justify-content:center}.sw{--swf:"Helvetica Neue",Helvetica,Arial,sans-serif;font-family:var(--swf);color:#f2f2ef;background:#1b1c1e;border:1px solid #2c2d30;border-radius:16px;width:100%;max-width:520px;padding:14px;box-sizing:border-box}
.sw *{box-sizing:border-box}
.sw-screen{background:#1b1c1e;border:0;border-radius:10px;padding:2px 8px 2px;text-align:center;container-type:inline-size}
.sw-t{font:700 16px/1.1 var(--swf);letter-spacing:.03em;text-transform:uppercase;margin:0 0 16px;white-space:nowrap;color:#fff}
.sw-list{list-style:none;margin:0;padding:0;text-align:left}
.sw-list li{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:clamp(9px,3cqw,16px);padding:clamp(9px,2.9cqw,15px) clamp(2px,1cqw,6px)}
.sw-list li+li::before{content:"";position:absolute;top:var(--sn,0px);left:clamp(12px,4.5cqw,24px);right:clamp(12px,4.5cqw,24px);height:0;border-top:1px solid #a9a9a4}
.sw-bul{width:clamp(38px,11.5cqw,56px);height:clamp(38px,11.5cqw,56px);flex:none;display:block}
.sw-bul text{font-family:var(--swf);font-weight:700;text-anchor:middle}
.sw-place{min-width:0;overflow-wrap:anywhere;line-height:1.14}
.sw-st{font:600 clamp(15px,5cqw,25px)/1.14 var(--swf);color:#fff}
.sw-de{font:400 clamp(11px,3.3cqw,16px)/1.2 var(--swf);color:#b9b9b4;margin-top:3px}
.sw-wait{display:flex;align-items:baseline;gap:3px;white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums}
.sw-n{font:700 clamp(28px,9.6cqw,48px)/1 var(--swf);letter-spacing:-.01em}
.sw-u{font:400 clamp(12px,3.5cqw,18px)/1 var(--swf);color:#d6d6d1}
.sw-s{font:400 clamp(10px,2.6cqw,13px)/1.2 var(--swf);color:#9d9d97;margin:clamp(4px,1.6cqw,9px) 0 0}
.sw [hidden]{display:none!important}

/* caption set in the same ink and size as the destination lines, with a rule under it like the rows, so it reads as part of the board */
.sw-sub{font:400 clamp(11px,3.3cqw,16px)/1.25 var(--swf);color:#c4c4bf;margin:0 auto;padding:0 clamp(12px,4.5cqw,24px) clamp(10px,3cqw,16px);text-wrap:balance;position:relative}
.sw-sub::after{content:"";position:absolute;top:calc(100% + var(--sn,0px));left:clamp(12px,4.5cqw,24px);right:clamp(12px,4.5cqw,24px);height:0;border-top:1px solid #a9a9a4}
/* rule between the last train and the "Updated" line, only when train rows are showing */
.sw-list:not([hidden])+.sw-s{position:relative;margin-top:0;padding-top:clamp(9px,2.9cqw,15px)}
.sw-list:not([hidden])+.sw-s::before{content:"";position:absolute;top:var(--sn,0px);left:clamp(12px,4.5cqw,24px);right:clamp(12px,4.5cqw,24px);height:0;border-top:1px solid #a9a9a4}
</style></head><body>
<section class="sw" id="sw" aria-labelledby="sw-t">
<div class="sw-screen">
<h2 class="sw-t" id="sw-t">NYC Subwaits</h2>
<p class="sw-sub">The three subway platforms in New York City that currently have the longest wait for the next train</p>
<ol class="sw-list" id="sw-list" hidden></ol>
<p class="sw-s" id="sw-s">Loading subway data…</p>
</div>
</section>
<script>(()=>{
// ---- configuration -------------------------------------------------------
// Leave empty on GitHub Pages: owner and repo are derived from OWNER.github.io[/REPO].
// If the site uses a custom domain, set this to 'OWNER/REPO'.
const REPO_OVERRIDE='mpg603/mpg';
const BRANCH='subway-wait-data',FILE='subway-wait.json';
const FEEDS_REQUIRED=7;      // all seven NYCT feeds must have been read
const MAX_FEED_AGE=900;      // seconds: oldest feed timestamp older than this = unavailable
const CLOCK_SKEW=120;        // seconds of tolerated future-dated snapshot
const REFRESH_MS=60000;
// --------------------------------------------------------------------------
const $=id=>document.getElementById(id);
const COL={1:'#EE352E',2:'#EE352E',3:'#EE352E',4:'#00933C',5:'#00933C',6:'#00933C',7:'#B933AD',A:'#0039A6',C:'#0039A6',E:'#0039A6',B:'#FF6319',D:'#FF6319',F:'#FF6319',M:'#FF6319',G:'#6CBE45',J:'#996633',Z:'#996633',L:'#A7A9AC',N:'#FCCC0A',Q:'#FCCC0A',R:'#FCCC0A',W:'#FCCC0A',S:'#808183'};
const DARK_TEXT=new Set(['N','Q','R','W']);
const local=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)||location.protocol==='file:';
const demo=local&&new URLSearchParams(location.search).get('preview')==='1';
function dataUrl(){
  let slug=REPO_OVERRIDE.trim();
  if(!slug){
    const m=location.hostname.match(/^([^.]+)\.github\.io$/i);
    if(!m)return null;
    const seg=location.pathname.split('/').filter(Boolean)[0];
    const repo=seg&&!/\.html?$/i.test(seg)?seg:m[1]+'.github.io';
    slug=m[1]+'/'+repo;
  }
  return 'https://raw.githubusercontent.com/'+slug+'/'+BRANCH+'/'+FILE;
}
const URL_=dataUrl();
let snap=null,busy=false,shown='',tried=false;
const rowOk=w=>w&&Number.isFinite(w.departure_epoch)&&typeof w.station==='string'&&typeof w.destination==='string'&&typeof w.route==='string';
const rowsOf=d=>Array.isArray(d.top)&&d.top.length?d.top:(d.winner?[d.winner]:[]);
const ok=d=>d&&d.schema===1&&d.feeds_checked===FEEDS_REQUIRED&&Number.isFinite(d.generated_epoch)&&Number.isFinite(d.oldest_feed_epoch)&&rowsOf(d).length>0&&rowsOf(d).length<=5&&rowsOf(d).every(rowOk);
function bullet(route){
  let r=route.toUpperCase(),exp=false;
  if(/^[1-7A-Z]X$/.test(r)){exp=true;r=r[0]}
  if(['GS','FS','H'].includes(r))r='S';
  if(!COL[r])r='S';
  return{r,exp};
}
const NS='http://www.w3.org/2000/svg';
function bulletSvg(route){
  const{r,exp}=bullet(route),svg=document.createElementNS(NS,'svg'),p=document.createElementNS(NS,'path'),t=document.createElementNS(NS,'text');
  svg.setAttribute('class','sw-bul');svg.setAttribute('viewBox','0 0 30 30');svg.setAttribute('role','img');svg.setAttribute('aria-label',r+' train');svg.setAttribute('focusable','false');
  p.setAttribute('d',exp?'M15 .8 29.2 15 15 29.2.8 15Z':'M15 1a14 14 0 1 0 0 28 14 14 0 0 0 0-28Z');p.setAttribute('fill',COL[r]);
  t.setAttribute('x','15');t.setAttribute('y','15');t.setAttribute('dy','.35em');t.setAttribute('fill',DARK_TEXT.has(r)?'#111':'#fff');t.setAttribute('font-size',exp?'16':'19');t.setAttribute('aria-hidden','true');t.textContent=r;
  svg.append(p,t);return svg;
}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function rowEl(w,min){
  const li=document.createElement('li'),place=el('div','sw-place'),wait=el('div','sw-wait');
  place.append(el('div','sw-st',w.station),el('div','sw-de','To '+w.destination));
  wait.append(el('span','sw-n',min),el('span','sw-u','min'));
  li.append(bulletSvg(w.route),place,wait);return li;
}
// put every black rule on a whole device pixel, so they all draw equally dark at fractional zoom or screen scaling (otherwise some straddle two pixel rows and look lighter)
function snapRules(){
  const root=$('sw'),dpr=window.devicePixelRatio||1,sy=window.scrollY||0;
  root.querySelectorAll('.sw-list li+li,.sw-sub,.sw-s').forEach(el=>{
    const r=el.getBoundingClientRect(),y=((el.classList.contains('sw-sub')?r.bottom:r.top)+sy)*dpr,n=((Math.round(y)-y)/dpr).toFixed(3)+'px';
    if(el.style.getPropertyValue('--sn')!==n)el.style.setProperty('--sn',n);
  });
}
function render(){
  const now=Date.now()/1000,list=$('sw-list'),s=$('sw-s');
  // the three longest waits, shown soonest first like the real countdown signs; a row whose train has left drops off the top until the next snapshot
  const rows=snap?rowsOf(snap).slice().sort((a,b)=>b.departure_epoch-a.departure_epoch).slice(0,3).reverse().filter(w=>w.departure_epoch>now):[];
  const stale=!snap||now-snap.oldest_feed_epoch>MAX_FEED_AGE||snap.generated_epoch-now>CLOCK_SKEW||!rows.length;
  if(stale){list.hidden=true;s.textContent=snap?'Subway data temporarily unavailable':(tried||!URL_?'Subway data unavailable':'Loading subway data…');shown='';snapRules();return}
  const mins=rows.map(w=>Math.max(1,Math.ceil((w.departure_epoch-now)/60))),key=snap.generated_epoch+'|'+mins.join(',');
  if(key!==shown){shown=key;list.replaceChildren(...rows.map((w,i)=>rowEl(w,mins[i])))}
  list.hidden=false;
  s.textContent=demo?'Design preview · example data':'Updated '+Math.max(0,Math.floor((now-snap.generated_epoch)/60))+' min ago';
  snapRules();
}
async function refresh(){
  if(demo||busy||!URL_)return;busy=true;
  try{
    const res=await fetch(URL_+'?v='+Math.floor(Date.now()/REFRESH_MS),{cache:'no-store'});
    if(!res.ok)throw Error('HTTP '+res.status);
    const d=await res.json();
    if(!ok(d))throw Error('invalid snapshot');
    if(!snap||d.generated_epoch>=snap.generated_epoch)snap=d;
  }catch(e){console.warn('Subway snapshot unavailable:',e.message)}
  finally{busy=false;tried=true;render()}
}
if(demo){const n=Math.floor(Date.now()/1000),q=new URLSearchParams(location.search);
  const row=(r,st,to,m)=>({route:r,station:st,destination:to,departure_epoch:n+m*60});
  snap={schema:1,feeds_checked:7,generated_epoch:n,oldest_feed_epoch:n,top:[
    row(q.get('r')||'1',q.get('st')||'18 St',q.get('to')||'South Ferry',+q.get('m')||19),
    row('A','Far Rockaway-Mott Av','Inwood-207 St',17),
    row('Q','Coney Island-Stillwell Av','96 St',14)]}}
render();refresh();
setInterval(refresh,REFRESH_MS);setInterval(render,1000);
addEventListener('resize',snapRules);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(snapRules);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();refresh()}});
})();
</script></body></html>
