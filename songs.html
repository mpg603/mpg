const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=u=>{const d=new Date(u*1000);return M[d.getMonth()]+' '+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?', '+d.getFullYear():'')};
const S=[['discovered','Just discovered','The most recent songs I listened to for the first time.',0,'first listen'],['returned','Went back to it','The most recent songs I listened to twice, because they were good enough to come back to.',1,'second listen'],['ten','On repeat','The most recent songs to hit ten plays. Safe to say they stuck.',2,'tenth listen']];

/* The player opens inside the page. Nothing is contacted until someone presses a play button. */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\([^)]*\)|\[[^\]]*\]/g,' ').replace(/\s[-\u2013\u2014].*$/,' ').replace(/[^a-z0-9\u00c0-\uffff ]+/g,' ').replace(/\s+/g,' ').trim();
const toks=s=>norm(s).split(' ').filter(w=>w.length>1&&!['the','and','feat','ft'].includes(w));
function best(list,x){
  const T=norm(x.title),A=toks(x.artist);
  for(const r of list){
    if(!r||!r.previewUrl||!r.trackName)continue;
    const rt=norm(r.trackName),ra=norm(r.artistName||'');
    const titleOk=rt===T||(T.length>3&&(rt.startsWith(T)||T.startsWith(rt)));
    const artistOk=!A.length||A.some(w=>ra.includes(w));
    if(titleOk&&artistOk)return r;
  }
  return null;
}
function jsonp(u){return new Promise((ok,no)=>{const n='_as'+Math.random().toString(36).slice(2),s=document.createElement('script'),done=()=>{delete window[n];s.remove()};
  window[n]=d=>{done();ok(d)};s.onerror=()=>{done();no(new Error('jsonp'))};setTimeout(()=>{if(window[n]){done();no(new Error('timeout'))}},8000);
  s.src=u+'&callback='+n;document.head.appendChild(s)})}
const cache={};
async function lookup(x){
  const k=x.artist+'|'+x.title;if(k in cache)return cache[k];
  const q=encodeURIComponent(x.artist+' '+x.title);
  const base='https://itunes.apple.com/search?media=music&entity=song&limit=8&term='+q;
  let j;
  try{const r=await fetch(base);if(!r.ok)throw new Error('lookup');j=await r.json()}
  catch(e){j=await jsonp(base)}  /* some browsers or networks block the plain request; Apple's search also answers as a script */const hit=best(j.results||[],x);

const okClip=u=>{try{const h=new URL(u);return h.protocol==='https:'&&/(^|\.)(mzstatic|apple)\.com$/.test(h.hostname)}catch(e){return false}};
function stopNow(){if(!now)return;try{now.audio.pause()}catch(e){}now.btn.innerHTML=PLAY;now.btn.setAttribute('aria-pressed','false');now.btn.classList.remove('on');now=null}
const closePlayer=stopNow;
function note(li,msg){const i=li.querySelector('.d i');if(!i)return;const keep=i.textContent;i.textContent=msg;setTimeout(()=>{i.textContent=keep},3500)}
async function toggle(li,btn,x){
  if(now&&now.btn===btn){stopNow();return}
  stopNow();
  btn.disabled=true;btn.classList.add('on');
  try{
    const url=await lookup(x);
    btn.disabled=false;
