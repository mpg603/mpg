<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miguel PG</title>
<style>
@font-face{font-family:Lato;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/lato-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Lato;font-weight:700;font-style:normal;font-display:swap;src:url(fonts/lato-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Lato;font-weight:900;font-style:normal;font-display:swap;src:url(fonts/lato-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Inter Tight";font-weight:100 900;font-style:normal;font-display:swap;src:url(fonts/inter-tight-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-weight:200 900;font-style:normal;font-display:swap;src:url(fonts/source-serif-4-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-weight:200 900;font-style:italic;font-display:swap;src:url(fonts/source-serif-4-latin-wght-italic.woff2) format("woff2")}
:root{--paper:#fff;--card:#FAF7ED;--ink:#171717;--muted:#6f6e68;--line:#E6E1D2;--blue:#18558C;
 --ui:Lato,system-ui,-apple-system,"Segoe UI",sans-serif;--text:"Source Serif 4",Charter,Georgia,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--text)}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* masthead */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;max-width:1320px;margin:0 auto;padding:18px 20px 0}
.mark{font:800 27px/1 "Inter Tight",var(--ui);letter-spacing:-.02em;text-decoration:none;color:#000}
.top nav{display:flex;gap:22px}
.top nav a{font:700 15px/1 var(--ui);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;color:var(--muted)}
.top nav a:hover{color:var(--ink)}
.top nav a[aria-current]{color:var(--ink);border-bottom-color:var(--ink)}
/* ? hints (the popover itself is drawn once, at page level, so no card can clip it) */
.hint{all:unset;box-sizing:border-box;cursor:help;width:20px;height:20px;border:1.5px solid currentColor;border-radius:50%;display:inline-grid;place-items:center;font:700 11px/1 var(--ui);color:#a7a59b;vertical-align:middle;flex:none;padding:0 0 1px 1.5px}
.hint:hover,.hint:focus-visible,.hint[aria-expanded=true]{color:var(--ink)}
#tipbox{position:fixed;z-index:100;max-width:230px;background:#171717;color:#fff;border-radius:7px;padding:6px 9px;font:700 13px/1.3 Lato,var(--ui);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.2);opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
#tipbox.on{opacity:1;visibility:visible}

.home{max-width:1100px;margin:0 auto;padding:0 20px 56px}
.qt{margin:22px 0 0;text-align:center;width:calc(100vw - 40px);max-width:1320px;position:relative;left:50%;transform:translateX(-50%)}
.cl{position:relative;display:inline-block}.cl .hint{position:absolute;left:100%;top:calc(50% - 8px);margin-left:7px;width:16px;height:16px;font-size:10px}.cap.cap2{margin:16px 0 0}.cap{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 0 10px;font:700 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.qrow{display:flex;align-items:center;gap:16px}
.qrow i{flex:1 1 24px;height:0;border-top:1.5px solid var(--ink)}
.qrow blockquote{flex:0 1 auto;max-width:48em;margin:0;font:italic 400 17px/1.45 var(--text);color:#403f3b;text-wrap:pretty}
.qrow blockquote .qo{display:block}.qrow blockquote .qd{display:block;margin:4px 0;font-style:normal;font-size:11px;line-height:1;color:var(--muted)}.qrow blockquote .qe{display:block}.qrow:has(blockquote.two){justify-content:center}.qrow:has(blockquote.two) i{display:none}.qrow blockquote.two{flex:0 1 auto;width:fit-content;max-width:min(100%,40em)}.qrow blockquote .qo{text-align:right}.qrow blockquote .qe{text-align:left}.qrow blockquote .qd{text-align:center}.qname{margin:6px 0 0;font:400 14px/1.3 var(--text);color:var(--muted)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;align-items:start;margin-top:42px}.pair>.sw{justify-self:end}.pair>.cell{justify-self:start;width:100%;max-width:520px;margin-top:0}@media(max-width:759px){.pair{grid-template-columns:minmax(0,1fr);row-gap:14px;max-width:520px;margin-inline:auto}.pair>.sw{justify-self:stretch;max-width:none}.pair>.cell{justify-self:stretch}}
.sw{--swf:"Helvetica Neue",Helvetica,Arial,sans-serif;font-family:var(--swf);color:#111;background:var(--card,#FAF7ED);border:1px solid var(--line,#E6E1D2);border-radius:16px;width:100%;max-width:520px;padding:14px;box-sizing:border-box}
.sw *{box-sizing:border-box}
.sw-screen{background:#fff;border:1px solid var(--line,#E6E1D2);border-radius:10px;padding:13px 8px 12px;text-align:center;container-type:inline-size}
.sw-t{font:700 clamp(12px,3.9cqw,18px)/1.1 var(--swf);letter-spacing:.03em;text-transform:uppercase;margin:0 0 clamp(4px,1.6cqw,9px);white-space:nowrap;color:#111}
.sw-list{list-style:none;margin:0;padding:0;text-align:left}
.sw-list li{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:clamp(9px,3cqw,16px);padding:clamp(9px,2.9cqw,15px) clamp(2px,1cqw,6px)}
.sw-list li+li::before{content:"";position:absolute;top:0;left:clamp(12px,4.5cqw,24px);right:clamp(12px,4.5cqw,24px);height:1px;background:#111}
.sw-bul{width:clamp(38px,11.5cqw,56px);height:clamp(38px,11.5cqw,56px);flex:none;display:block}
.sw-bul text{font-family:var(--swf);font-weight:700;text-anchor:middle}
.sw-place{min-width:0;overflow-wrap:anywhere;line-height:1.14}
.sw-st{font:600 clamp(15px,5cqw,25px)/1.14 var(--swf);color:#111}
.sw-de{font:400 clamp(11px,3.3cqw,16px)/1.2 var(--swf);color:#444;margin-top:3px}
.sw-wait{display:flex;align-items:baseline;gap:3px;white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums}
.sw-n{font:700 clamp(28px,9.6cqw,48px)/1 var(--swf);letter-spacing:-.01em}
.sw-u{font:400 clamp(12px,3.5cqw,18px)/1 var(--swf);color:#222}
.sw-s{font:400 clamp(10px,2.6cqw,13px)/1.2 var(--swf);color:#6f6e68;margin:clamp(4px,1.6cqw,9px) 0 0}
.sw [hidden]{display:none!important}

/* caption set in the same ink and size as the destination lines, with a rule under it like the rows, so it reads as part of the board */
.sw-sub{font:400 clamp(11px,3.3cqw,16px)/1.25 var(--swf);color:#444;margin:clamp(2px,.8cqw,5px) auto 0;padding:0 clamp(12px,4.5cqw,24px) clamp(10px,3cqw,16px);text-wrap:balance;position:relative}
.sw-sub::after{content:"";position:absolute;bottom:0;left:clamp(12px,4.5cqw,24px);right:clamp(12px,4.5cqw,24px);height:1px;background:#111}

.shuf{all:unset;box-sizing:border-box;position:absolute;left:12px;top:8px;z-index:3;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer}.shuf:hover{border-color:#c9c3ad}.shuf:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.shuf svg{width:14px;height:14px;display:block}
.cell{position:relative;margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chead{display:flex;align-items:center;justify-content:center;position:relative;padding:14px 44px 0;font:700 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);z-index:2}
.chead .hint{position:absolute;right:14px;top:10px}
.cell iframe{display:block;width:100%;border:0;background:transparent;margin-top:2px}
.hit{position:absolute;left:0;right:0;top:40px;bottom:46px;z-index:1}
.more{display:block;position:relative;z-index:2;text-align:center;padding:10px 0 18px;font:700 14px/1 var(--ui);text-decoration:none}
.more:hover{text-decoration:underline}
</style></head><body>
<header class="top"><a class="mark" href="index.html">Miguel PG</a><nav aria-label="Main"><a href="index.html" aria-current="page">Home</a><a href="funstuff.html">Fun Stuff</a></nav></header>
<main class="home">
<section class="qt" aria-label="Quote of the hour"><p class="cap"><span class="cl">Quote of the hour<button class="hint" type="button" aria-label="About the quote of the hour" data-tip="A new quote every hour, on the hour. Reload within the same hour and you will see the same one.">?</button></span></p><div class="qrow"><i></i><blockquote id="qtext"></blockquote><i></i></div><p class="qname" id="qname"></p></section>
<div class="pair">
<section class="sw" id="sw" aria-labelledby="sw-t">
<div class="sw-screen">
<h2 class="sw-t" id="sw-t">NYC Subwaits</h2>
<p class="sw-sub">The three subway platforms in New York City that currently have the longest wait for the next train</p>
<ol class="sw-list" id="sw-list" hidden></ol>

</div>

</div>

<script>(()=>{const box=document.createElement('div');box.id='tipbox';box.setAttribute('role','tooltip');document.body.appendChild(box);let cur=null,pinned=false;
const hintOf=e=>e.target.closest&&e.target.closest('.hint');
function show(b){cur=b;box.textContent=b.dataset.tip;box.classList.add('on');const r=b.getBoundingClientRect(),w=box.offsetWidth,vw=document.documentElement.clientWidth;let x=Math.min(Math.max(12,r.right-w),vw-w-12),y=r.bottom+8;if(y+box.offsetHeight>innerHeight-8)y=r.top-box.offsetHeight-8;box.style.left=x+'px';box.style.top=y+'px';b.setAttribute('aria-expanded','true')}
function hide(){box.classList.remove('on');if(cur)cur.setAttribute('aria-expanded','false');cur=null;pinned=false}
document.addEventListener('mouseover',e=>{const b=hintOf(e);if(b&&!pinned)show(b)});
document.addEventListener('mouseout',e=>{if(hintOf(e)&&!pinned)hide()});
document.addEventListener('focusin',e=>{const b=hintOf(e);if(b&&!pinned)show(b)});
document.addEventListener('focusout',e=>{if(hintOf(e)&&!pinned)hide()});
document.addEventListener('click',e=>{const b=hintOf(e);if(b){e.preventDefault();e.stopPropagation();if(pinned&&cur===b)hide();else{hide();pinned=true;show(b)}}else hide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});addEventListener('scroll',hide,{passive:true});addEventListener('resize',hide)})();
</script>

<script>(()=>{

function dataUrl(){
  let slug=REPO_OVERRIDE.trim();

    const m=location.hostname.match(/^([^.]+)\.github\.io$/i);

    const seg=location.pathname.split('/').filter(Boolean)[0];

const URL_=dataUrl();

function render(){
