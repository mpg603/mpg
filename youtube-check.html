<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video collection check</title>
<style>body{font:14px/1.4 system-ui,sans-serif;margin:24px;color:#111}table{border-collapse:collapse;width:100%;max-width:980px}td,th{border-bottom:1px solid #ddd;padding:6px 8px;text-align:left;vertical-align:top}.ok{color:#1a7f37}.bad{color:#b42318;font-weight:700}.unk{color:#9a6700}code{font-size:13px}</style></head>
<body><h1>Video collection check</h1>
<p>Private maintenance page. It asks YouTube about every ID in <code>youtube-videos.json</code> from this browser. Nothing is changed or removed.</p>
<p id="sum">Checking…</p><table><thead><tr><th>#</th><th>ID</th><th>Your note</th><th>Result</th><th>Shape</th></tr></thead><tbody id="rows"></tbody></table>
<script>
(async()=>{
const list=await (await fetch('youtube-videos.json',{cache:'no-cache'})).json(),rows=document.getElementById('rows'),seen={};let bad=0,unk=0;
for(let i=0;i<list.length;i++){
  const v=list[i],tr=document.createElement('tr');rows.appendChild(tr);
  const cell=(t,c)=>{const d=document.createElement('td');d.textContent=t;if(c)d.className=c;tr.appendChild(d);return d};
  cell(i+1);const idc=cell(v.id);cell(v.note||'');
  let res,cls,shape='';
  if(seen[v.id]){res='DUPLICATE of #'+seen[v.id];cls='bad';bad++}else{
    seen[v.id]=i+1;
    try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+v.id));
      if(r.ok){const j=await r.json();res='OK — "'+j.title+'" by '+j.author_name;cls='ok';shape=(j.width/j.height).toFixed(2)+(Math.abs(j.width/j.height-4/3)<.05?' (4:3)':Math.abs(j.width/j.height-16/9)<.05?' (16:9)':'')}
      else if(r.status===401||r.status===403){res='Embedding disabled or private ('+r.status+')';cls='bad';bad++}
      else if(r.status===404){res='Not found / deleted ('+r.status+')';cls='bad';bad++}
      else{res='Unexpected answer ('+r.status+')';cls='unk';unk++}
    }catch(e){res='Could not check (network or blocked)';cls='unk';unk++}
  }
  cell(res,cls);cell(shape);
}
document.getElementById('sum').textContent=list.length+' entries · '+bad+' problem'+(bad===1?'':'s')+' · '+unk+' could not be checked';
})();
</script></body></html>
